<!DOCTYPE html>
<html><body>
<script>
const videos = [
  "Home Page.mov",
  "Adding goals.mov",
  "Goal Breakdown.mov",
  "progress bar.mov",
  "streak.mov"
];
async function process() {
  for (let file of videos) {
    await new Promise(resolve => {
      let v = document.createElement("video");
      v.src = "/images/" + encodeURI(file);
      v.crossOrigin = "anonymous";
      v.muted = true;
      v.onloadeddata = () => {
        v.currentTime = 2; 
      };
      v.onseeked = () => {
        let canvas = document.createElement("canvas");
        canvas.width = v.videoWidth;
        canvas.height = v.videoHeight;
        let ctx = canvas.getContext("2d");
        ctx.drawImage(v, 0, 0);
        let data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
        
        let minX = canvas.width, maxX = 0;
        
        // Edge detection specifically targeting the black/dark phone chassis border
        // (Ignoring bright screen UI, ignoring pure white backgrounds, ignoring light drop shadows)
        let startY = Math.floor(canvas.height * 0.4);
        let endY = Math.floor(canvas.height * 0.6);
        for (let y = startY; y < endY; y += 2) {
          for (let x = 0; x < canvas.width; x += 1) {
            let i = (y*canvas.width + x)*4;
            // The physical bezel of the phone is usually extremely dark (< 40 RGB)
            if (data[i] < 45 && data[i+1] < 45 && data[i+2] < 45) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
            }
          }
        }
        
        let phoneCenter = (minX + maxX) / 2;
        let contH = canvas.height;
        let contW = contH * (9/16);
        let ratio = (phoneCenter - contW/2) / (canvas.width - contW);
        let pct = Math.max(0, Math.min(100, Math.round(ratio * 1000) / 10));
        
        let msg = document.createElement("div");
        msg.innerText = `${file} => ${pct}% center (minX: ${minX}, maxX: ${maxX})`;
        msg.className = "result";
        document.body.appendChild(msg);
        resolve();
      };
      v.onerror = () => {
        let msg = document.createElement("div");
        msg.innerText = file + " => ERROR";
        msg.className = "result";
        document.body.appendChild(msg);
        resolve();
      };
    });
  }
}
process();
</script>
</body></html>
